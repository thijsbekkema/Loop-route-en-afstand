name: Paden bijwerken

on:
  schedule:
    - cron: "23 3 1 * *"   # elke maand op de 1e, 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  paden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gereedschap installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: OpenStreetMap-data ophalen en uitsnijden
        run: |
          for p in friesland groningen drenthe; do
            curl -fsSL -o $p.osm.pbf https://download.geofabrik.de/europe/netherlands/$p-latest.osm.pbf
          done
          osmium merge friesland.osm.pbf groningen.osm.pbf drenthe.osm.pbf -o merged.osm.pbf
          osmium extract -s complete_ways -b "$(python maak_paden.py --bbox)" merged.osm.pbf -o regio.osm.pbf
          osmium tags-filter regio.osm.pbf w/highway -o wegen.osm.pbf
      - name: Tegels maken
        run: python maak_paden.py wegen.osm.pbf paden/v1
      - name: Opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paden
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Paden bijgewerkt $(date +%Y-%m-%d)"
          git push
      - name: Website opnieuw publiceren
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Publiceren gebeurt vanzelf"
